# Promemoria della riunione alle 12:00 (ora italiana) del giorno prima.
# GitHub usa l'ora UTC: gira alle 10:00 e alle 11:00 UTC, e lo script invia solo
# quando in Italia sono le 12 (10 UTC con l'ora legale, 11 UTC con l'ora solare).
# Legge comms/prossima_riunione.json: invia solo se la riunione è il giorno dopo.
name: Discord - promemoria riunione

on:
  schedule:
    - cron: "0 10,11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promemoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lanciata a mano (Run workflow): niente controllo sull'ora
      - run: python comms/invia_discord.py promemoria ${{ github.event_name == 'schedule' && '--ora 12' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
