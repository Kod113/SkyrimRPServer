; ============================================================
;  SKYRIM RP LAUNCHER - CONFIGURAZIONE
;  Modifica questo file prima di usare il launcher.
;  NON serve toccare launch_skyrimrp.bat.
; ============================================================

; === RETE ===
; IP del server (LAN: es. 192.168.1.100 | Internet: IP pubblico o hostname)
SERVER_IP=192.168.1.100
; Porta STR (default Together Reborn: 10578)
SERVER_PORT=10578

; === MOD ORGANIZER 2 ===
; Percorso completo all'eseguibile di MO2
MO2_EXE=C:\MO2\SkyrimRP\ModOrganizer.exe
; Nome esatto del profilo MO2 configurato per il server
MO2_PROFILE=SkyrimRP
; Nome dell'eseguibile SKSE come appare nella lista di MO2
; (vai su MO2 > menu a tendina in alto > controlla il nome esatto)
MO2_SKSE_NAME=SKSE

; === SKYRIM ===
; Cartella di installazione di Skyrim Special Edition
SKYRIM_PATH=C:\Program Files (x86)\Steam\steamapps\common\Skyrim Special Edition
